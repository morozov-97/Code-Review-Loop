name: Release

# #132: the only way to get this tool today is `cargo build --release` from a clone — fine for
# contributors, not for anyone just wanting to try it. Builds prebuilt binaries + checksums for
# macOS (Apple Silicon + Intel) and Linux and attaches them to a GitHub Release whenever a
# `v*` tag is pushed. Deliberately NOT doing (per the issue's own scoping): crates.io/Homebrew,
# build provenance/attestation, or Windows — flagged as later work, not gaps in this workflow.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: codereview-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: codereview-macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: codereview-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package + checksum
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/codereview" "dist/${{ matrix.artifact_name }}"
          cd dist
          shasum -a 256 "${{ matrix.artifact_name }}" > "${{ matrix.artifact_name }}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/*/*
