name: Evals (golden set)

# #124: the prompt-injection-attempt.patch case in evals/ is the empirical regression test for
# promptctx.rs's fenced() defense (see evals/README.md), but it wasn't wired into any workflow
# at all — a future change that weakens the injection defense wouldn't be caught unless someone
# happened to run this manually. workflow_dispatch (manual trigger) instead of every push/PR
# since this costs real OpenRouter API money per run (5 cases, several sequential LLM calls
# each) and needs OPENROUTER_API_KEY configured as a repo secret.
on:
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Build release binary
        run: cargo build --release
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Run promptfoo golden set
        working-directory: evals
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        # #145: pinned instead of @latest — this job runs with OPENROUTER_API_KEY in its env,
        # and an unpinned `npx <pkg>@latest` with no lockfile both breaks eval reproducibility
        # (different promptfoo versions can score differently) and executes whatever the latest
        # published release is with no version pin to fall back on if one is compromised.
        run: npx promptfoo@0.122.0 eval -c promptfooconfig.yaml --no-cache -j 1
