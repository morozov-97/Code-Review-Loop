name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        # MSRV (declared in Cargo.toml's rust-version) alongside stable -- stable alone never
        # actually verifies the declared MSRV still builds; a change using a post-1.85
        # stdlib/language feature would pass CI while silently breaking anyone pinned to it.
        rust: ["1.85", stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Rust
        # This SHA pins the action release itself (unrelated to which Rust version gets
        # installed) -- `with: toolchain` below is what actually selects 1.85 vs stable.
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - name: Rust format
        if: matrix.rust == 'stable'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: matrix.rust == 'stable'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Cargo check
        run: cargo check --workspace --all-targets
      - name: Cargo test
        run: cargo test --workspace --all-targets
      - name: Install cargo-audit
        if: matrix.rust == 'stable'
        # taiki-e/install-action's own per-tool tags (like the `cargo-audit` ref used before this
        # pin) are moving refs, updated on every new install-action release -- pinned to a commit
        # SHA the same way checkout/rust-toolchain above are, instead of the one remaining step
        # in this file that wasn't.
        uses: taiki-e/install-action@0a916b3e09da2eeac8ac613c8303b8008ac46ab7 # cargo-audit
      - name: Cargo audit
        if: matrix.rust == 'stable'
        run: cargo audit
