[package]
name = "codereview-loop"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "codereview"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
ureq = { version = "3", features = ["json"] }
